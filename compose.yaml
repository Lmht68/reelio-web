name: reelio-frontend

services:
  frontend:
    build:
      context: .
    image: "reelio-frontend:${REELIO_FRONTEND_IMAGE_TAG:-local}"
    restart: unless-stopped
    ports:
      - "${REELIO_FRONTEND_HOST_PORT:-4174}:80"
    environment:
      BACKEND_UPSTREAM: "${REELIO_BACKEND_UPSTREAM:-api:8181}"
    networks:
      - backend

networks:
  backend:
    external: true
    name: "${REELIO_BACKEND_NETWORK:-reelio_default}"
